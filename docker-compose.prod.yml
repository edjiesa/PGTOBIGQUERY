version: '3.8'

services:
  # ── Nginx Reverse Proxy ──────────────────────────────────────────────
  # Handles HTTP + WebSocket upgrade (ws://) proxying on port 82
  nginx:
    image: nginx:alpine
    container_name: pgtobigquery_nginx
    restart: always
    ports:
      - "82:80"        # Akses dari luar: http://peerdb.smmf.com:82
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pgtobigquery_app

  # ── Migration App ────────────────────────────────────────────────────
  pgtobigquery_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgtobigquery_app
    restart: on-failure
    # TIDAK expose langsung ke luar — hanya nginx yang akses via Docker network
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PG_HOST: ${PG_HOST:-host.docker.internal}
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DATABASE: ${PG_DATABASE:-postgres}
      PG_SCHEMA: ${PG_SCHEMA:-public}
      PG_SSLMODE: ${PG_SSLMODE:-prefer}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-your-gcp-project-id}
      BIGQUERY_DATASET_ID: ${BIGQUERY_DATASET_ID:-pg_remote_migrated_db}
      GCP_CREDENTIALS_FILE: /app/gcp-credentials.json
      BATCH_SIZE: 50000
      DATA_DIR: /app/data
      WEB_HOST: "0.0.0.0"
      WEB_PORT: 8000
    volumes:
      - ./.env:/app/.env:ro
      - ./gcp-service-account.json:/app/gcp-credentials.json:ro
      - pg_data_store:/app/data

volumes:
  pg_data_store:
    driver: local
