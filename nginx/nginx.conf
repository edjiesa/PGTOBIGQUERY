worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Timeouts — penting untuk migrasi lama
    proxy_connect_timeout       600s;
    proxy_send_timeout          600s;
    proxy_read_timeout          600s;
    send_timeout                600s;
    keepalive_timeout           600s;

    server {
        listen 80;
        server_name _;

        # ── WebSocket proxy (WAJIB untuk /ws/logs) ──────────────────────
        # Tanpa blok ini, WebSocket SELALU gagal di belakang Nginx
        location /ws/ {
            proxy_pass         http://pgtobigquery_app:8000;
            proxy_http_version 1.1;

            # Header wajib untuk WebSocket upgrade
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeout khusus WebSocket (harus panjang)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── HTTP API & Dashboard proxy ───────────────────────────────────
        location / {
            proxy_pass         http://pgtobigquery_app:8000;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Upload/response size (untuk SA JSON key)
            client_max_body_size 10M;
        }
    }
}
