version: '3.8'

services:
  # Standalone PostgreSQL to BigQuery Migration App Container
  # Connects directly to ANY remote PostgreSQL server (RDS, Cloud SQL, Azure, On-premise, or host.docker.internal)
  pgtobigquery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pgtobigquery_app
    restart: on-failure
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PG_HOST: ${PG_HOST:-host.docker.internal}
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DATABASE: ${PG_DATABASE:-postgres}
      PG_SCHEMA: ${PG_SCHEMA:-public}
      PG_SSLMODE: ${PG_SSLMODE:-prefer}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-your-gcp-project-id}
      BIGQUERY_DATASET_ID: ${BIGQUERY_DATASET_ID:-pg_remote_migrated_db}
      GCP_CREDENTIALS_FILE: /app/gcp-credentials.json
      BATCH_SIZE: 50000
      DATA_DIR: /app/data
      WEB_HOST: "0.0.0.0"
      WEB_PORT: 8000
    volumes:
      - ./.env:/app/.env:ro
      # Optional: Volume mount your GCP Service Account JSON key if not passing via Web UI
      - ./gcp-service-account.json:/app/gcp-credentials.json:ro
      - pg_data_store:/app/data

volumes:
  pg_data_store:
    driver: local

